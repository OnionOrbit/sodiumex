name: Build and release Sodiumex

permissions:
  contents: write

on:
  push:
    branches:
      - arena/d89d050b-sodiumex
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the successfully built mod jars as a GitHub prerelease
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decide whether this run publishes a release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          DISPATCH_PUBLISH_RELEASE: ${{ inputs.publish_release }}
        shell: bash
        run: |
          publish=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_PUBLISH_RELEASE" == "true" ]]; then
            publish=true
          elif [[ "$EVENT_NAME" == "push" && "$COMMIT_MESSAGE" == *"[release]"* ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Release publishing: $publish"

      - name: Clean, compile, test, and build release jars
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean check test build -Pbuild.release=true 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Clean, compile, test, and build snapshot jars
        if: steps.release.outputs.publish != 'true'
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean check test build 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Surface Gradle diagnostics if the build failed
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/gradle-build.log" ]]; then
            python - <<'PY'
          import os
          import re
          from pathlib import Path
          all_lines = Path(os.environ["RUNNER_TEMP"], "gradle-build.log").read_text(errors="replace").splitlines()
          keywords = re.compile(r"(?i)(FAILURE:|what went wrong|error:|\be:\s|could not|unresolved reference|caused by:|script compilation)")
          selected = []
          for index, line in enumerate(all_lines):
              if keywords.search(line):
                  selected.extend(all_lines[max(0, index - 2):min(len(all_lines), index + 3)])
          # Keep unique lines in order, then include the log tail for context.
          details = list(dict.fromkeys(selected))
          if not details:
              details = all_lines[-80:]
          details = (details + all_lines[-30:])[-100:]
          text = "\n".join(details)
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text("## Gradle failure diagnostics\n\n```text\n" + text + "\n```\n")
          # Emit a bounded annotation so diagnostics remain visible even if Actions log downloads are unavailable.
          message = text[-5000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Gradle failure details::{message}")
          PY
          fi

      - name: Verify loader jars were produced
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/mods/*.jar)
          if (( ${#jars[@]} < 2 )); then
            echo "Expected Fabric and NeoForge mod jars under build/mods; found ${#jars[@]}"
            find build -type f -name '*.jar' -print || true
            exit 1
          fi
          printf 'Built artifacts:\n'
          printf ' - %s\n' "${jars[@]}"

      - name: Upload built mod jars
        uses: actions/upload-artifact@v7
        with:
          name: sodiumex-mc26.3-mod-jars
          path: build/mods/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag='mc26.3-0.9.3-beta.1'
          notes='Sodiumex beta for Minecraft Java 26.3. Contains Fabric and NeoForge builds. Install the jar matching your loader; Lithium, FerriteCore, and ImmediatelyFast are already nested. This release passed the automated Gradle check/test/build workflow. A manual in-game smoke test is still recommended.'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" build/mods/*.jar --clobber
          else
            gh release create "$tag" build/mods/*.jar \
              --target "$GITHUB_SHA" \
              --title 'Sodiumex 0.9.3-beta.1 for Minecraft 26.3' \
              --notes "$notes" \
              --prerelease
          fi
